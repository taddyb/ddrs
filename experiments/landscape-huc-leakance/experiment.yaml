# Regional curvature census in the LEAKANCE frame: axes [n, K_D, d_gw] on the
# two-way leakance + n(d) arm, ten gauges in each of the 18 HUC2 regions
# (180 gauges), so per-region trends in what the daily hydrograph constrains
# can be read. Same axes, box, grid, fd_step, planes and slice centre as
# experiments/landscape-jrb-leakance/ so the Juniata read is one region of this.
#
# Gauge selection (2026-09-21, huc_selection.csv beside this file): from the
# 2,365-gauge WY2000 census population (landscape-p21-all), HUC02 from the
# GAGES-II shapefile (10U/10L merged), 3 <= n_reach <= 300, ten per region
# evenly spaced in network-size rank so each region spans headwater to ~300
# reaches. Every region had >= 21 eligible gauges.
#
#   target/release/ddrs --workspace .ddrs experiment landscape-huc-leakance \
#       --backend cpu --shard I/16   # (2026-09-22 run used --bundle <scratch copy>)
