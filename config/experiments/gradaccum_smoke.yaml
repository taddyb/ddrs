# Gradient-accumulation CPU smoke config.
#
# Mechanics check only — NOT a science run: tiny batches (8 gauges), short
# rho, 1 epoch, CPU solver. Drive with:
#
#   cargo build --release --bin ddrs
#   target/release/ddrs run --config config/experiments/gradaccum_smoke.yaml \
#       --workspace /home/tbindas/projects/ddrs/.ddrs \
#       --workflow train --max-mini-batches 2 --backend cpu
#
# With grad_accum_steps: 2 and --max-mini-batches 2 (which counts optimizer
# STEPS in accumulation mode) this runs 2 steps × 2 micro-batches = 4
# forwards. Expected log shape per step:
#     micro 1/2 gauges=8 loss=... n=...
#     micro 2/2 gauges=8 loss=... n=...
#   mb=K loss=... (accumulated 2/2 micro-batches, n=...)

mode: training
workflow: train
geodataset: merit
seed: 42
np_seed: 42

data_sources:
  attributes: /home/tbindas/projects/ddr/data/merit_global_attributes_v2.nc
  conus_adjacency: /home/tbindas/projects/ddr/data/merit_conus_adjacency.zarr
  gages_adjacency: /home/tbindas/projects/ddr/data/merit_gages_conus_adjacency.zarr
  streamflow: /mnt/ssd1/data/icechunk/daily_dhbv2_distributed_aorc2f_merit_unit_catchments.ic
  observations: /mnt/ssd1/data/icechunk/usgs_daily_observations
  gages: /home/tbindas/projects/ddr/references/gage_info/gages_3000.csv

experiment:
  batch_size: 8
  start_time: 1981/10/01
  end_time: 1995/09/30
  epochs: 1
  rho: 30
  shuffle: true
  warmup: 5
  grad_accum_steps: 2
  learning_rate:
    1: 0.001
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  grid: 50
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  learnable_parameters:
    - n
    - q_spatial
    - p_spatial

params:
  parameter_ranges:
    n: [0.015, 0.25]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
  log_space_parameters:
    - p_spatial
  sparse_solver: cpu
  use_cuda_graphs: false

testing:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 15
  rho: null
