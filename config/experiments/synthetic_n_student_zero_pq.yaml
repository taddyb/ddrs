# synthetic_n_student_zero_pq.yaml — student zero in the AGREED parameterization:
# channel geometry PRESCRIBED (p = 21, q = 0.65, the values every real-data arm
# now uses), the head emits n only. Same teacher observations, same Q'_true,
# same disagg head, seed, epochs as synthetic_n_student_zero.yaml.
#
# Purpose (2026-09-21): with n, p, q all learned, student zero drifted 1.8x
# above the true n along a three-way (n, p, q) valley. With p and q pinned the
# valley is gone by construction. Prediction: the drift disappears and the
# level of n is recovered. Caveat: the teacher's geometry was the per-reach
# CONSENSUS field (JRB medians q ~0.46, p ~6.6), not 21 / 0.65, so the truth n
# is no longer the exact minimum; whatever displacement remains measures how
# much a wrong-but-fixed geometry biases the recovered roughness level, which
# is exactly the real-data situation.
#
mode: training
workflow: train-and-test
geodataset: merit
device: 0
seed: 42
np_seed: 42

data_sources:
  attributes: /home/tbindas/projects/ddr/data/merit_global_attributes_v2.nc
  conus_adjacency: /home/tbindas/projects/ddr/data/merit_conus_adjacency.zarr
  gages_adjacency: /home/tbindas/projects/ddr/data/merit_gages_conus_adjacency.zarr
  streamflow: /mnt/ssd1/data/icechunk/merit_dhbv2_UH_retrospective.ic   # teacher's Q'_true
  observations: /home/tbindas/projects/ddrs/output/synthetic_n/synthetic_obs_lm
  gages: /home/tbindas/projects/ddr/references/gage_info/gages_3000.csv
  aorc_precip: /mnt/ssd1/data/aorc/merit_unit_catchments.zarr

experiment:
  batch_size: 64
  start_time: 1981/10/01
  end_time: 1995/09/30
  epochs: 5
  rho: 90
  shuffle: true
  warmup: 5
  learning_rate:
    1: 0.001
    3: 0.0005
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  grid: 50
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  learnable_parameters:
    - n
  # Capacity-boosted disagg head — architecture MUST match capacity_chunk1.mpk
  # (pretrain_disagg_capacity --chunk-days 1: hidden 16, 2 layers, grid 20, k 3).
  disaggregation:
    hidden_size: 16
    num_hidden_layers: 2
    grid: 20
    k: 3
    boundary_blend: 0.0
    chunk_days: 1
    pretrained_checkpoint: /home/tbindas/projects/ddrs/output/disagg_pretrain/capacity_chunk1.mpk
    freeze: true

params:
  parameter_ranges:
    n: [0.015, 0.25]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
    q_spatial: 0.65
  log_space_parameters:
    - p_spatial
  sparse_solver: cuda
  use_cuda_graphs: false
  use_leakance: false

testing:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 15
  rho: null
