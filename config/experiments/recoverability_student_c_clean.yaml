# recoverability_student_c_clean.yaml — recovery control on the CLEAN (state-cache) objective.
# GENERATED from recoverability_student_c.yaml + experiment.state_cache.
# recoverability_student_c.yaml — synthetic losing-reach recoverability (positive control).
# GENERATED from leakance_hourly_on.yaml — student C: cold init, leakance ON, synthetic obs
# Spec: docs/superpowers/specs/2026-07-03-synthetic-recoverability-design.md

mode: training
workflow: train-and-test
geodataset: merit
seed: 42
np_seed: 42

data_sources:
  attributes: /home/tbindas/projects/ddr/data/merit_global_attributes_v2.nc
  conus_adjacency: /home/tbindas/projects/ddr/data/merit_conus_adjacency.zarr
  gages_adjacency: /home/tbindas/projects/ddr/data/merit_gages_conus_adjacency.zarr
  streamflow: /mnt/ssd1/data/icechunk/merit_dhbv2_UH_retrospective.ic
  observations: /home/tbindas/projects/ddrs/output/recoverability/synthetic_obs
  gages: /home/tbindas/projects/ddr/references/gage_info/gages_3000.csv
  # Hourly AORC precip — required by the precip-conditioned disaggregation head below.
  aorc_precip: /mnt/ssd1/data/aorc/merit_unit_catchments.zarr

experiment:
  state_cache: /home/tbindas/projects/ddrs/output/floor_fix/state_cache_teacher.nc
  batch_size: 64
  start_time: 1981/10/01
  end_time: 1995/09/30
  epochs: 5
  rho: 90
  shuffle: true
  warmup: 5
  learning_rate:
    1: 0.001
    3: 0.0005
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  grid: 50
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  learnable_parameters:
    - n
    - q_spatial
    - p_spatial
    - K_D
    - d_gw
    - leakance_factor
  # Precip-conditioned mass-preserving daily->hourly disaggregation head.
  disaggregation:
    hidden_size: 16

params:
  use_leakance: true
  parameter_ranges:
    n: [0.015, 0.25]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
    # Widened from 1e-6 (2026-07-03 decision): at the old ceiling only 23/96
    # plant sites could express a detectable loss. Teacher + students share
    # this range, so expressibility and warm-start attribution still hold.
    K_D: [1.0e-8, 1.0e-5]
    d_gw: [-2.0, 2.0]
    leakance_factor: [0.0, 1.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
  log_space_parameters:
    - p_spatial
    - K_D
  sparse_solver: cpu
  use_cuda_graphs: false

testing:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 15
  rho: null
