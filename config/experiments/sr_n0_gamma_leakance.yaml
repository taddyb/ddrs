# sr_n0_gamma_leakance
#
# THE COMBINED ARM: stage-dependent roughness n(d) = n_0*(d/d_ref)^(-gamma) AND
# losing-stream leakance, both learned per reach, at the same time.
#
# Until 2026-09-17 this configuration could not be expressed. `TimestepLeakanceOp`
# had eight parents and none was gamma, so a learned gamma would silently have
# received no gradient; `validate_learned_gamma` rejected the pair at load rather
# than let that happen. `TimestepLeakanceGammaOp` (nine parents) removes the
# restriction, gradient-checked in tests/leakance_gamma_gradcheck.rs against
# central differences on all nine parents, at gamma > 0 and gamma < 0.
#
# WHAT THIS ARM IS FOR. Every prior leakance run used a plain depth-independent
# Manning's n, so the two mechanisms that can absorb depth-dependent volume error
# were never allowed to compete. They should compete: leakance removes water
# (it can only fix a SURPLUS), while gamma changes how fast water moves at a
# given stage. If the head can reach the same skill through either, that is
# equifinality between two physically distinct processes, measured with exact
# gradients rather than inferred from a Monte Carlo cloud.
#
# MATCHED CONTROLS, all four cells needed before attributing anything:
#   sr_n0_only.yaml            n_0 alone            (neither)
#   sr_n0_gamma.yaml           n_0 + gamma          (n(d) alone)
#   sr_n0_leakance.yaml        n_0 + leakance       (leakance alone)
#   THIS FILE                  n_0 + gamma + leakance
#
# BOX CHANGES vs sr_n0_gamma, all from research/findings/2026-09-17-parameter-range-audit.md:
#   gamma  [0, 0.5]      -> [-0.2, 0.85]   too narrow at BOTH ends
#   K_D    [1e-8, 1e-6]  -> [1e-8, 1e-3]   narrow box was misplaced; 5 decades
#                                          covers clogged through gravel beds
#   d_gw   [-2, 2]       -> [-5, 1]        water tables sit metres below the bed
#                                          in the losing reaches this term targets
#
# READ THE K_D RESULT WITH CARE. Every leakance run before 2026-09-16 had K_D
# frozen: `log_space_lower` collapsed its [1e-8, 1e-6] box to a span of ~1e-8
# with the log range INVERTED, and K_D is log-space here. This is the first arm
# in which K_D can actually move. Report |u_med - 0.5| alongside any K_D number:
# a sigmoid head with near-zero output bias reports the box centre, so a learned
# value at the centre is not evidence of anything.
#
#   ddrs --config config/experiments/sr_n0_gamma_leakance.yaml \
#     --workspace /home/tbindas/projects/ddrs/.ddrs \
#     run --workflow train-and-test --plot --backend cuda

mode: training
workflow: train-and-test    # ddrs plan/run picks this up; override with --workflow X
geodataset: merit
seed: 42
np_seed: 42

# Source paths — read in place by ddrs's Rust loaders (zarrs + icechunk + netcdf).
# No export/materialization step; the harness reads DDR's live data sources
# straight from disk.
data_sources:
  # CONUS MERIT inputs as available on the workstation.
  attributes: /home/tbindas/projects/ddr/data/merit_global_attributes_v2.nc
  conus_adjacency: /home/tbindas/projects/ddr/data/merit_conus_adjacency.zarr
  gages_adjacency: /home/tbindas/projects/ddr/data/merit_gages_conus_adjacency.zarr
  # Icechunk dHBV2 UH retrospective (divide-major, daily m³/s)
  streamflow: /mnt/ssd1/data/icechunk/merit_dhbv2_UH_retrospective.ic
  # Icechunk USGS daily observations
  observations: /mnt/ssd1/data/icechunk/usgs_daily_observations
  gages: /home/tbindas/projects/ddr/references/gage_info/gages_3000.csv

experiment:
  batch_size: 64
  start_time: 1981/10/01
  end_time: 1995/09/30
  epochs: 50   # 2026-09-10: 30 -> 50, with grad_accum_steps 4 this is 500 optimizer updates (was 60)
  rho: 90
  shuffle: true
  warmup: 5
  # Gradient accumulation ON. `batch_size` is now the MICRO-batch; the optimizer
  # steps once per `grad_accum_steps` micro-batches, so the effective batch is
  # 64 * 4 = 256 gauges and the gradient is averaged over ~4x more basins.
  #
  # THE ARITHMETIC — read this before trusting a run:
  #   1,841 gauges / 64 = 28 full + 1 partial = 29 micro-batches per epoch
  #     (accumulation sets `drop_last = false`, driver.rs:268-275, so the
  #      49-gauge tail is KEPT — unlike the non-accumulating path)
  #   29 / 20 = one group of 20 + one partial group of 9.
  #     A partial group STILL STEPS: only `micros_drawn == 0` breaks the loop
  #     (driver.rs:415), and the 1/Σn renormalization makes unequal group sizes
  #     exact. So this is 2 optimizer steps per epoch, not 1.
  #   x 30 epochs = 60 TOTAL UPDATES
  #
  # Effective batch is 20*64 = 1,280 of 1,841 gauges — 70% of the training set
  # in a single gradient, i.e. near full-batch. Very low variance, very few steps.
  #
  # THAT IS THE RISK. Calibration: the run that beat the summed-Q' baseline
  # (2026-07-30T00-24, median NSE 0.6799) took 180 updates at lr 1e-3 and moved
  # the head L2(dw) = 9.75. The 2026-08-04 run that hit NSE 0.6782 took 280.
  # Adam's per-weight displacement is bounded by ~lr per step, so the budget
  # here is 40*0.001 + 20*0.0005 = 0.050 — about 38% of the 0.132 that the
  # 180-step run realized. Expect under-training.
  #
  # If it under-trains, prefer more STEPS over a hotter lr:
  #   * `grad_accum_steps: 20` -> 7   (5 steps/epoch, 150 updates, eff batch 448)
  #   * `grad_accum_steps: 20` -> 4   (8 steps/epoch, 240 updates, eff batch 256)
  # Wall clock is forward-pass bound (~27.5 s/micro-batch), so all of these cost
  # the SAME time — 29 forwards per epoch regardless. Lowering accum_steps buys
  # optimizer steps for free; it only trades gradient variance for step count.
  #
  # The historical `grad_accum_steps: 37` was WORSE than either: with 28-37
  # micro-batches per epoch it collapsed a whole epoch into ONE update, so 50
  # epochs bought 50 updates for 1,850 forward passes. Wall clock here is
  # forward-pass bound (~27.5 s/micro-batch), not step bound, so accumulating
  # costs nothing in time — it only trades update count for gradient quality.
  #
  # ALWAYS verify the head actually moved (L2(dw)) before believing a result:
  # the 2026-07-31 AdaDelta run reported plausible losses while L2(dw) = 1.9e-4,
  # i.e. it never left initialization.
  use_grad_accum: true
  # 2026-09-10: 20 -> 4. The 2026-09-08 run made 60 optimizer updates in total
  # (37 micro-batches/epoch at 2,365 kept gauges, 2 steps/epoch, 30 epochs) and
  # findings §21 shows it never reached a stationary point: on BOTH the training
  # and testing windows the loss still falls if roughness rises, at ~79% of
  # gauges (trimmed gradient alignment 0.96/0.94). At accum 4 that is 10
  # steps/epoch, so 500 updates over 50 epochs, effective batch 4*64 = 256.
  # Wall clock is forward-pass bound at 37 forwards/epoch either way: the
  # 30-epoch run trained in 64 min, so 50 epochs is ~107 min. The "27.5 s per
  # micro-batch" figure above is stale; measured here it is ~3.5 s.
  grad_accum_steps: 4
  # Adam, reverting the 2026-07-31 AdaDelta run. That run's head moved
  # L2(dw) = 1.9e-4 (0.0004% of ||w||) across all 30 epochs — it never left
  # initialization. Cause: `experiment.learning_rate` IS applied to AdaDelta
  # (driver.rs:404 passes lr to optimizer.step; adadelta.rs:123 multiplies
  # delta by it) despite config.rs:211-213 documenting the key as inert, so
  # every update ran 1000x scaled down. dHBV intends AdaDelta at lr=1.0.
  optimizer: adam
  loss:
    kind: nse-batch
  # Step schedule. Keys are the FIRST epoch at which the lr applies
  # (`resolve_lr` takes the largest key <= epoch, 1-indexed). At 2 optimizer
  # steps per epoch (see the accumulation note above):
  #   epochs  1-20 @ 0.001   (40 updates)
  #   epochs 21-30 @ 0.0005  (20 updates)
  # Total displacement budget ~0.050. The decay lands 2/3 of the way through,
  # which is the right shape — the concern is the step COUNT, not the schedule.
  #
  # Watch `n_at_floor` in the log: the lr=0.01 run pinned 47.3% of CONUS at the
  # 0.015 floor, and both 2026-08-04 runs collapsed from 0% to 25-36% between
  # epochs 3 and 5 at lr 2e-3. Starting at 1e-3 is deliberately cooler than that.
  # Near-full-batch gradients (1,280 gauges) should also damp the collapse, since
  # it looked like a high-variance small-batch effect — but that is a hypothesis,
  # not an established result. If `n_at_floor` climbs past a few percent, the lr
  # is still too hot.
  # 2026-09-10: flattened. n froze at epoch 10 in the previous run, which is
  # exactly where the old schedule cut 0.005 -> 0.001, so "the gradient
  # vanished" and "the steps became too small" were not separable from the
  # trajectory (§10 correction). §21 shows the gradient had NOT vanished.
  # Keys are the FIRST epoch at which the lr applies. At 10 steps/epoch:
  #   epochs  1-20 @ 0.005   (200 updates)
  #   epochs 21-40 @ 0.002   (200 updates)
  #   epochs 41-50 @ 0.001   (100 updates)
  # Displacement budget ~1.3 against the previous ~0.13.
  # WATCH `n_at_floor`: lr 0.01 pinned 47.3% of CONUS at the 0.015 floor and
  # lr 2e-3 collapsed 0% -> 25-36% by epoch 5 in earlier small-batch runs.
  # Holding 0.005 for 200 updates at an effective batch of 256 is the real risk
  # in this plan. If n_at_floor passes a few percent, drop the first rate to
  # 0.002 and keep the step count.
  # FIVE TIMES COOLER than the no-leakance arms (which run 0.005/0.002/0.001).
  # A CONUS full-recipe leakance run at that schedule diverged to NaN at epoch
  # 15 -- finite loss, non-finite gradient -- and a 5x lower lr removed it, so
  # the divergence is step-size, not structural. The July campaign never saw
  # this because the denormalize bug had K_D frozen, which was stabilising.
  # Monotone by construction: an earlier schedule of mine stepped the rate UP
  # at epoch 21 because only the first entry had been lowered.
  learning_rate:
    1: 0.001
    21: 0.0004
    41: 0.0002
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  # B-spline grid intervals (`num` in pykan). Matches DDR's
  # ~/projects/ddr/config/merit_training_config.yaml::kan.grid.
  grid: 50
  # B-spline order. Matches DDR's ::kan.k. (pykan's KANLayer default is 3,
  # but DDR overrides to 2 for production.)
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  # All three learned together. The baseline fixed p_spatial at 21
  # (docs/2026-09-08-fixed-p-assessment.md); §30 argued that learning p and q
  # as a pair relocates the free parameter onto something falsifiable against
  # remotely sensed river width, and §31 showed q alone was only n amplified
  # fourfold. Because this differs from the baseline in TWO ways (learnable set
  # and head topology), the shared-linear arm is the matched control: read
  # these arms against each other, never against 0.7376/0.7600.
  learnable_parameters:
    - n
    - gamma
    - K_D
    - d_gw
    - leakance_factor
  # Precip-conditioned mass-preserving daily->hourly disaggregation head.
  # The within-day shape is driven by the hourly AORC precip window
  # [d-1,d,d+1] (+ daily-Q taps + static attrs); the daily mean is conserved
  # exactly. Loss stays the historical L1 (no experiment.loss block).
  # Warm-started FROZEN from the standalone capacity pretrain (chunk_days=1);
  # architecture fields must match that checkpoint or load_record fails.
  # `enabled: false` makes this whole block inert — the loader uses flat
  # repeat-24 (nearest) upsampling instead. Flip to true for the head-on
  # arm of the ablation; nothing else needs to change.
  disaggregation:
    enabled: false
    hidden_size: 16
    num_hidden_layers: 2
    grid: 20
    k: 3
    boundary_blend: 0.0
    chunk_days: 1
    pretrained_checkpoint: /home/tbindas/projects/ddrs/output/disagg_pretrain/capacity_chunk1.mpk
    freeze: true

# Routing-engine knobs — DDR's MERIT defaults (matches mock_config in tests).
params:
  parameter_ranges:
    # Stage-roughness exponent, n(d) = n_0*(d/d_ref)^(-gamma).
    #
    # WIDENED from [0, 0.5] on 2026-09-17. The old floor of 0 encoded "channels
    # get smoother as they fill", which is true in-bank, where relative bed
    # roughness falls as depth grows, and false once flow reaches a vegetated
    # floodplain or any composite section, where effective roughness RISES with
    # stage. Those reaches were not merely discouraged, they were unrepresentable.
    # The old ceiling of 0.5 sat only 0.14 above the most plausible physical
    # values (Jarrett 0.16, at-a-station 0.183), which is too little headroom to
    # call a learned value interior. Literature spans 0 (deep Manning-Strickler)
    # to 0.83 (shallow roughness layer).
    #
    # Safety: the depth exponent 3/(5+3q+3*gamma) only degenerates at
    # gamma = -(5+3q)/3, about -2.3 at the prescribed q = 0.65, so -0.2 is far
    # from it. Both signs are gradient-checked (tests/leakance_gamma_gradcheck.rs).
    # Box centre is now 0.325 rather than 0.25; the sigmoid head reports the
    # centre when uninformed, so compare learned values against 0.325 here.
    gamma: [-0.2, 0.85]
    n: [0.015, 0.25]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
    # Streambed leakance K_D = K/M (1/s), the MODFLOW river-package conductance
    # per unit bed area.
    #
    # THE CEILING IS NOT THE POINT, THE CENTRE IS. The head is a sigmoid with
    # near-zero output bias, so every parameter STARTS at its box centre, and
    # for a log-space parameter that centre is the GEOMETRIC mean. Widening a
    # box therefore relocates where training begins:
    #
    #   [1e-8, 1e-6]  -> centre 1e-7      initial loss 0.149,  2.9% reaches negative
    #   [1e-8, 1e-3]  -> centre 3.16e-6   initial loss 0.513, 30.8% reaches negative
    #
    # Measured 2026-09-17, same seed, that box the only difference. The wide
    # box put 31.6x more conductance in at epoch zero; zeta is linear in K_D,
    # so leakance drained a third of the network below zero, the S28 clamp
    # rewrote all of them to 1e-4, and the gradient through that many saturated
    # clamps went non-finite on the FIRST optimizer step. Loss was finite right
    # up to the step, which is why this looks like an optimizer problem and is
    # not one.
    #
    # THE UNDERLYING FLAW, which was invisible while the denormalize bug kept
    # K_D frozen: nothing bounds zeta by the water actually in the reach. The
    # `losing_only` clamp fixes the SIGN of the exchange, not its MAGNITUDE, so
    # a large enough conductance removes more water than exists. Watch
    # `reaches with negative discharges pre clamp` in the run log: the no-leakance
    # rate is ~2-4%, and a climb well above that means this bound is being hit.
    #
    # [1e-9, 1e-5] is chosen so the geometric centre is EXACTLY 1e-7, the
    # historically stable init, while spanning four decades instead of two and
    # reaching the measured streambed range (8.8e-8 to 2.1e-5 1/s, Abimbola at
    # M = 1 m). Physical coverage without moving the starting point.
    K_D: [1.0e-9, 1.0e-5]
    # Water-table elevation relative to the streambed (m). Positive = table
    # ABOVE the bed.
    #
    # THE CEILING IS SET BY THE GAINING REGIME. Exchange direction is set by
    # stream STAGE, not bed: a reach gains when `d_gw > depth`. Measured against
    # the independent water table on 63,365 CONUS reaches, using this model's
    # own routed depths (p50 = 0.29 m, p90 = 1.28 m):
    #
    #   should be GAINING (table above stage):  63.7%
    #   should be losing:                       36.3%
    #
    # The previous ceiling of +1.0 m sat below the true table on 45.3% of
    # reaches. [-2, 3] covers 80.4% of the field distribution against 39.3% for
    # [-2, 1]. The deep tail (field p1 = -71 m) needs no coverage because the
    # disconnection cap makes every state below -M identical.
    #
    # Centre is +0.5: connected (`d_gw > -M`, so d_gw carries gradient at epoch
    # 1) and, against a 0.29 m median depth, starts the model GAINING on most
    # reaches, which is the regime the reference says dominates.
    d_gw: [-2.0, 3.0]
    leakance_factor: [0.0, 1.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
    # Fixed width exponent: the at-a-station Leopold & Maddock value b/f = 0.65
    # (design doc §2.2), which with gamma ~ 0.18 reproduces the observed
    # at-a-station exponents. Must lie inside parameter_ranges.q_spatial.
    q_spatial: 0.65
  log_space_parameters:
    - p_spatial
    # K_D spans five decades, so it must be sampled in log space or the head
    # can only ever reach the top decade. `log_space_lower` was fixed on
    # 2026-09-16; before that this line silently froze K_D to a constant.
    - K_D
  # Corrected physics instead of DDR's formulation. With `false` the routing
  # core uses:
  #   * exact trapezoidal celerity  c = v·β,  β = 5/3 − (4/3)·A·√(1+z²)/(T·P)
  #     instead of the wide-rectangular 5/3 limit (which is 22-27% high for the
  #     channels this code builds — κ = b/y ≈ 0.7-1.8, so β ≈ 1.31-1.36), and
  #   * Cunge-derived Muskingum X = clamp(0.5(1 − Q/(T·S·c·L)), 0, 0.5) instead
  #     of the constant 0.3, which was injecting a median 28× excess numerical
  #     diffusion.
  # Negative-discharge counting before the S28 clamp is reported in BOTH modes.
  # This breaks `compare_ddr_sandbox`'s ABSOLUTE MATCH by design — that example
  # must be run with the default `ddr_match: true`.
  # See `.claude/PHYSICS-CORRECTIONS.md`.
  # Losing-stream leakance: zeta = gate(leakance_factor) * area_z * K_D * (depth - d_gw)
  # subtracted from the routing RHS. Positive zeta = a losing reach.
  use_leakance: true
  # TWO-WAY EXCHANGE. `true` (the default, and what every prior leakance run
  # used) clamps gaining reaches to zeta = 0, which disables 63.7% of CONUS by
  # the independent water table's own reckoning. It also quietly explains a
  # result previously attributed to physics: the KGE decomposition showed
  # leakance only helps gauges whose inflow over-delivers, because a sink can
  # only remove a surplus. That is half physics and half this flag.
  #
  # The risk of turning it off is real and asymmetric. A source term can
  # manufacture water wherever the model runs short, so it will absorb inflow
  # deficits and improve skill while meaning nothing, and dHBV's q' already
  # carries baseflow, which IS the gaining contribution. Two things guard it:
  # `leakance_max_rhs_fraction` below bounds |zeta| so the exchange stays a
  # correction rather than a source, and the READ-OUT is the partial
  # correlation of learned d_gw against the withheld water table, not skill.
  #
  # What two-way buys scientifically: a SIGN constraint. The model must now
  # place the table correctly relative to stream stage, not merely pick a
  # plausible magnitude. That is a far sharper test of whether d_gw is a
  # physical quantity than anything run so far.
  leakance_losing_only: false
  # |zeta| <= alpha * relu(b_rhs_base): the exchange may move at most this
  # fraction of the locally available Muskingum RHS, in EITHER direction.
  #
  # Without it, nothing bounds the flux by the water present. Measured on the
  # four-reach harness at K_D = 5e-3, an unbounded leakance drains the network
  # to the discharge floor (total 0.004) while alpha = 0.1 holds it at 33.92.
  # That unbounded drain is what produced the 2026-09-17 NaN: 30.8% of reaches
  # negative pre-clamp against a 2-4% baseline, then a non-finite gradient
  # through the saturated clamps on the first optimizer step.
  #
  # 0.25 lets the exchange be a substantial correction (a quarter of local
  # flow) without letting it dominate. Watch `reaches with negative discharges
  # pre clamp`: the no-leakance rate is 2-4%.
  leakance_max_rhs_fraction: 0.25
  # Streambed thickness M (m) for the DISCONNECTION CAP:
  #   head = min(depth - d_gw, depth + M)
  # Once the water table falls more than M below the bed an unsaturated zone
  # opens beneath the channel, stream and aquifer stop being hydraulically
  # connected, and the flux is set by the head across the bed layer alone
  # rather than by the distance down to the table. This is the MODFLOW river
  # package's RBOT behaviour.
  #
  # Why it matters here and not just as a nicety: the uncapped linear head
  # grows without bound, so at depth 1.5 m a d_gw of -80 m gives 12x the flux
  # of -5 m for the same conductance. A large head with a small K_D is then
  # indistinguishable from a small head with a large one, and K_D and d_gw
  # become degenerate with each other by construction. The cap removes that
  # direction, which is the point: this arm is trying to learn d_gw as a
  # physical quantity, not as one half of a product.
  #
  # 1.0 m is the upper end of the typical alluvial range (0.1 to 1 m), chosen
  # deliberately: a larger M keeps more reaches connected and therefore
  # gradient-bearing. Absent ⇒ no cap, byte-identical to every run before
  # 2026-09-17 and to the DDR c2bd0f9 reference.
  leakance_bed_thickness: 1.0
  # Temperature-annealed 0/1 gate on the head's leakance_factor output.
  #
  # Replaces the continuous factor, which was doing the wrong job: a factor in
  # [0, 1] lets the head water leakance DOWN, and a scaled-down conductance is
  # degenerate with a smaller K_D, so the two parameters competed for the same
  # direction. What the model actually needs is a decision -- this reach
  # exchanges water with the aquifer, or it does not.
  #
  # g = sigmoid(logit(clamp(u, eps, 1-eps)) / tau). At tau = 1 this is exactly
  # the identity, bit-for-bit, so epoch 1 reproduces the ungated run and the
  # anneal is a continuous deformation away from it rather than a discontinuity.
  # By tau = 0.05 the gate is effectively 0/1 and the head must commit.
  leakance_gate:
    temperature:
      1: 1.0
      11: 0.5
      21: 0.25
      31: 0.1
      41: 0.05
  ddr_match: false
  # Provably zero negative discharges. Clamps the Muskingum INPUTS (K, X) into
  # the non-negative-coefficient window `2X <= Cr <= 2(1-X)`, Cr = dt/K:
  #   K <- max(K, dt*(1+d)/2)                     => Cr <= 2/(1+d)
  #   X <- min(X_cunge, (1-d)*Cr/2, (1-d)*(1-Cr/2))
  # with d = POSITIVITY_DELTA = 1e-2. Clamping K and X (not the coefficients)
  # keeps `c1+c2+c3 = 1` exact, so mass is conserved; clamping c3 would not.
  # With c1,c3 >= 0 and q_t,q' > 0, induction over the topological order of the
  # forward substitution proves the whole solve is non-negative.
  #
  # Measured: 0 / 197,461,880 solves on 1,841 gauges (was 55,181, 0.0279%),
  # replicated across two windows, two backends, and two trained heads.
  #
  # COST — this is not free. The X cap binds on 95.3% of reach-timesteps and
  # median X falls 0.4976 -> 0.0794 (6.3x), so it largely REPLACES the Cunge X
  # rather than shading it: numerical diffusion becomes stability-set instead of
  # matched to hydraulic diffusivity. NSE/KGE impact is UNMEASURED, and this is
  # the first training run to use the flag. Compare against a matched
  # `enforce_positivity: false` control before trusting the result.
  #
  # Root-cause alternative: median Cr is 0.226, i.e. the typical MERIT reach is
  # ~4.4x too LONG for an hourly step. Subdividing reaches ~4x brings Cr to ~1,
  # where X_max -> 0.5 and the cap stops biting. See .claude/PHYSICS-CORRECTIONS.md.
  #
  # Requires ddr_match: false (rejected at load otherwise).
  # OFF. It delivered provably zero negative solves (0 / 197,461,880), but the
  # cure was worse than the disease: capping X collapsed the median from 0.4976
  # to 0.0794 on 95.3% of reach-timesteps, and because the cap is applied at
  # RUNTIME to a learned celerity it made X ~ Cr ~ 1/n — handing the optimizer a
  # lever it rode straight to the roughness floor. Same lr, flag on vs off:
  # n_at_floor 35% -> 97.9%. Superseded by reach subdivision (a BUILD-TIME fix
  # with no gradient path): see docs/superpowers/plans/2026-08-05-reach-subdivision.md
  enforce_positivity: false
  # cuSPARSE triangular solve. Pair with `ddrs run --backend cuda`; it is inert
  # under `--backend cpu`. This is a DIFFERENT `Backward` impl from the host
  # solve, sitting directly downstream of the ddr_match/enforce_positivity
  # terms — gradient-checked on GPU by `tests/cuda_backward_parity.rs`.
  sparse_solver: cuda
  # MUST be false when ddr_match is false: the fused CUDA-graph kernel
  # (cuda_graph/geometry_kernel.rs) hardcodes DDR's 5/3 celerity, so a captured
  # graph would replay the DDR forward while the backward used the corrected
  # chain rule — a silent gradient mismatch. Config load rejects the pair.
  use_cuda_graphs: false

# Test-mode overlay. When the binary is run with --mode testing, these keys
# replace the corresponding ones in `experiment:`. Absent keys inherit.
#
# IMPORTANT: batch_size SEMANTIC SHIFTS between modes:
#   - experiment.batch_size (training) = number of GAUGES per mini-batch
#   - testing.batch_size              = number of DAYS per chunk
testing:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 15      # DAYS, not gauges
  rho: null           # disabled in test mode
