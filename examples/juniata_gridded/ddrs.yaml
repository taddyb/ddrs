# Gridded (ISIMIP DDM30) Juniata sample — the ddrs mirror of DDR's
# examples/juniata_gridded (DeepGroundwater/ddr PR #194).
#
# Same gauge as examples/juniata (USGS 01567000, 8,657 km²) but the river
# network is the 0.5° DDM30 grid: four cells split into 27 Courant≈1
# sub-reaches of ~7 km. The 1.6 MB bundle under examples/juniata_gridded/data/
# is byte-identical to DDR's; nothing external is needed.
#
# Run FROM THE REPO ROOT (data paths below are repo-root-relative):
#
#   ddrs --config examples/juniata_gridded/ddrs.yaml plan
#   ddrs --config examples/juniata_gridded/ddrs.yaml run --workflow train-and-test --backend cpu
#
# The workspace (.ddrs/) is created beside this file. `plan` relabels the
# sub-reach store into ddrs's subdivided layout and cuts the gauge subgraph
# into .ddrs/adjacency/<key>/ (parent = grid cell, pieces = sub-reaches).
#
# Hyperparameters mirror DDR's examples/juniata_gridded/train_gridded.py —
# keep them in sync when comparing against the Python implementation.

mode: training
workflow: train-and-test
geodataset: ddm30
device: 0
seed: 42
np_seed: 42

data_sources:
  # DDR's sub-reach adjacency zarr (`order`, `parent_cell`, `indices_0/1`,
  # `length_m`, `slope`, `lat`, `lon`), 27 rows over 4 cells. This is the
  # gridded counterpart of `geospatial_fabric`: ddrs builds the managed
  # stores from it on first `plan`.
  gridded_network: examples/juniata_gridded/data/juniata_subreach_adjacency.zarr
  # 25 attributes for all 5,198 CONUS cells (`COMID` = cell id), so the
  # normalisation statistics match a CONUS run. Sidecar:
  # data/statistics/merit_attribute_statistics_ddm30_conus_attributes.nc.json
  # (generated by scripts/build_attribute_statistics.py; ddrs never recomputes).
  attributes: examples/juniata_gridded/data/ddm30_conus_attributes.nc
  # Daily lateral inflow per CELL (`Qr(divide_id, time)`, divide_id = cell
  # id): dHBV2 UH retrospective area-weighted onto the four cells. Each cell's
  # Q' is split evenly across its sub-reaches at routing time.
  streamflow: examples/juniata_gridded/data/juniata_qprime.ic
  # USGS daily observed discharge at 01567000 (icechunk store).
  observations: examples/juniata_gridded/data/juniata_obs.ic
  # One-row gauge table. The `cell` column (DDR's name) is the snapped DDM30
  # cell; ddrs reads it as the outlet id and routes to that cell's most
  # downstream sub-reach.
  gages: examples/juniata_gridded/data/juniata_gage.csv

experiment:
  # Single gauge → one mini-batch (one random rho-day window) per epoch, so
  # `epochs` is the optimizer-step count. 30 steps demonstrates that the
  # gridded network trains and routes; it is not a converged model.
  batch_size: 1
  start_time: 1981/10/01
  end_time: 1995/09/30
  epochs: 30
  rho: 90
  shuffle: true
  warmup: 5
  # train_gridded.py uses a constant Adam lr of 1e-3 (no halving).
  learning_rate:
    1: 0.001
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  grid: 50
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  learnable_parameters:
    - n
    - q_spatial
    - p_spatial

params:
  # train_gridded.py::make_config bounds (n is narrower than the MERIT
  # Juniata example's [0.015, 0.25]).
  parameter_ranges:
    n: [0.02, 0.2]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
  log_space_parameters:
    - p_spatial
  tau: 9
  # The sub-reach store is already split by DDR; ddrs's MERIT reach plan
  # must stay off (config load rejects `enabled: true` with gridded_network).
  subdivision:
    enabled: false
  # CPU-friendly: no CUDA requirement anywhere in the sample.
  sparse_solver: cpu
  use_cuda_graphs: false

# Evaluation overlay (water years 1996–2010, as train_gridded.py).
# CAUTION — batch_size changes meaning: GAUGES in training, DAYS here.
testing:
  start_time: 1995/10/01
  end_time: 2010/09/30
  batch_size: 15
  rho: null
