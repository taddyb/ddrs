# Hudson River tidal example: stage-routed tidal mainstem below the Federal
# Dam at Troy, with a measured water-level boundary at The Battery (NOAA 8518750).
#
# Network: the MERIT reaches upstream of the New York Harbor outlet (COMID
# 73005067), 756 reaches. A pseudo-gauge at the outlet (no observations) makes
# every training batch the whole domain. The stage block runs on the 41-reach
# tidal mainstem; every other reach runs MC. Targets: Poughkeepsie (01372058,
# USGS tidally filtered discharge 72137), Green Island (01358000), Croton (01375000).
#
# The channel geometry is a uniform placeholder (see data/hudson_channel_geometry.csv).
# tidal_filter: godin filters the hourly routed discharge at Poughkeepsie before
# daily pooling, to match USGS parameter 72137.
#
# Run FROM THE REPO ROOT. Give --workspace explicitly (the default would put
# .ddrs/ beside this file):
#
#   ddrs --config examples/hudson/ddrs.yaml --workspace /path/to/.ddrs plan
#   ddrs --config examples/hudson/ddrs.yaml --workspace /path/to/.ddrs run --workflow train-and-test --backend cpu

mode: training
workflow: train-and-test
geodataset: merit
device: 0
seed: 42
np_seed: 42

data_sources:
  attributes: examples/hudson/data/hudson_attributes.nc
  conus_adjacency: examples/hudson/data/hudson_conus_adjacency.zarr
  gages_adjacency: examples/hudson/data/hudson_gages_adjacency.zarr
  # Daily Q' from 2001-05-01 (the Battery record starts then).
  streamflow: examples/hudson/data/hudson_qprime.ic
  # USGS daily discharge; Poughkeepsie is the merged 72137 series.
  observations: examples/hudson/data/hudson_obs.ic
  gages: examples/hudson/data/hudson_gage.csv
  stage_boundary: examples/hudson/data/hudson_battery_stage_navd88.csv
  channel_geometry: examples/hudson/data/hudson_channel_geometry.csv

experiment:
  # batch_size is the gauge count, so every mini-batch is the whole domain.
  batch_size: 4
  # Training window (water years 2003–2012).
  start_time: 2002/10/01
  end_time: 2012/09/30
  epochs: 30
  rho: 90
  shuffle: true
  warmup: 5
  learning_rate:
    1: 0.001
    15: 0.0005
  grad_clip_max_norm: 1.0

kan_head:
  hidden_size: 21
  num_hidden_layers: 2
  grid: 50
  k: 2
  input_var_names:
    - SoilGrids1km_clay
    - aridity
    - meanelevation
    - meanP
    - NDVI
    - meanslope
    - log10_uparea
    - SoilGrids1km_sand
    - ETPOT_Hargr
    - Porosity
  learnable_parameters:
    - n
    - q_spatial
    - p_spatial

params:
  parameter_ranges:
    n: [0.015, 0.25]
    q_spatial: [0.0, 1.0]
    p_spatial: [1.0, 200.0]
  attribute_minimums:
    discharge: 1.0e-4
    slope: 1.0e-3
    velocity: 0.01
    depth: 0.01
    bottom_width: 0.01
  defaults:
    p_spatial: 21.0
  log_space_parameters:
    - p_spatial
  # Hours the routed output is advanced before daily scoring (signed-at-zero
  # convention; matches DDR's tau: 9).
  tau: 9
  # Corrected physics (trapezoid-exact celerity β, Cunge-matched X, own-reach
  # gauge readout) is the default — the same physics as DDR's Juniata example
  # since DDR PR #192.
  # CPU-friendly: no CUDA requirement anywhere in the sample.
  sparse_solver: cpu
  use_cuda_graphs: false
  stage_routing:
    enabled: true
    theta: 0.6                          # friction edges
    theta_control: 0.5                  # dam edges; no dam in this stage set, unused
    substeps: 4                         # 900 s steps resolve the M2 tide
    reaches: [73001655]                 # reach below Green Island; closure = the 41-reach tidal mainstem
    downstream_boundary: prescribed_stage
    boundary_comid: 73005067            # the harbor outlet; refuses a stage set that drains elsewhere
    anchor_elevation_m: -10.0           # the table outlet's bed_z_m (NAVD88); change both together
    geometry: table
    tidal_filter: godin                 # Godin filter on stage-row gauges, in training and eval

# Evaluation overlay (2012-10-01 to 2019-08-31, inside the 72137 record).
# CAUTION — batch_size changes meaning: GAUGES in training, DAYS here.
# 2600 days covers the whole test period (2,526 days) in ONE eval chunk. A 15-day
# chunk seam leaks into the 71 h Godin filter at Poughkeepsie (see the README).
testing:
  start_time: 2012/10/01
  end_time: 2019/08/31
  batch_size: 2600
  rho: null
